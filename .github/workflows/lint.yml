name: Lint

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  abi:
    name: ABI
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -B tools/generate_abi.py --check
      - run: python -B -m unittest discover -s tools -p 'test_*.py'

  python:
    name: Python
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: >-
          python -m pip install --only-binary=:all: -r .config/ariad/lints/python-requirements.txt
      - run: ruff check --config .config/ariad/lints/ruff.toml bindings/python tools
      - run: ruff format --check --config .config/ariad/lints/ruff.toml bindings/python tools
      - run: mypy --config-file .config/ariad/lints/mypy.ini
      - run: python -B -m unittest discover -s bindings/python -p 'test_*.py'

  go:
    name: Go
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CGO_ENABLED: '1'
      CGO_CPPFLAGS: -I${{ github.workspace }}/crates/ffi/include
      GOMAXPROCS: '2'
      GOFLAGS: -p=2
      GOTELEMETRY: 'off'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.4'
          cache: false
      - name: Check formatting
        working-directory: bindings/go
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: bindings/go
          args: --config ../../.config/ariad/lints/golangci.yml --issues-exit-code=1
          skip-cache: true

  native:
    name: C / C++
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: >-
          python -m pip install --only-binary=:all: -r .config/ariad/lints/native-requirements.txt
      - run: clang-tidy --verify-config --config-file=.config/ariad/lints/clang-tidy.yml
      - name: Check formatting
        run: >-
          clang-format --dry-run --Werror
          --style=file:.config/ariad/formatters/clang-format.yml
          $(git ls-files '*.c' '*.h' '*.hpp')
      - name: Check C and C++
        run: |
          clang-tidy --config-file=.config/ariad/lints/clang-tidy.yml crates/ffi/tests/consumer.c -- \
            -std=c11 -Wall -Wextra -Wpedantic -Werror -pthread -Icrates/ffi/include
          clang-tidy --config-file=.config/ariad/lints/clang-tidy.yml crates/ffi/include/ariad.hpp -- \
            -xc++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -Icrates/ffi/include
          clang-tidy --config-file=.config/ariad/lints/clang-tidy.yml \
            bindings/mobile/android/ariad_metadata_jni.c -- \
            -std=c11 -Wall -Wextra -Wpedantic -Werror -Icrates/ffi/include \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux"
          for header in bindings/mobile/apple/*.h; do
            clang-tidy --config-file=.config/ariad/lints/clang-tidy.yml "$header" -- \
              -xc -std=c11 -Wall -Wextra -Wpedantic -Werror -Icrates/ffi/include
          done
      - name: Check data flow
        run: |
          cppcheck --enable=warning,style,performance,portability --check-level=exhaustive \
            --error-exitcode=1 --std=c11 --platform=unix64 --library=posix -U_WIN32 \
            -Icrates/ffi/include crates/ffi/tests/consumer.c
          cppcheck --enable=warning,style,performance,portability --check-level=exhaustive \
            --error-exitcode=1 --std=c++17 --platform=unix64 \
            -Icrates/ffi/include crates/ffi/include/ariad.hpp
          cppcheck --enable=warning,style,performance,portability --check-level=exhaustive \
            --error-exitcode=1 --std=c11 --platform=unix64 \
            -Icrates/ffi/include -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            bindings/mobile/android/ariad_metadata_jni.c

  swift:
    name: Swift
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: |
          curl --fail --location --retry 2 \
            https://github.com/realm/SwiftLint/releases/download/0.65.1/swiftlint_linux_amd64.zip \
            --output "$RUNNER_TEMP/swiftlint.zip"
          sha256sum --check <<EOF
          caeed6f4a679c35539ffaf124f6c4ab4a8416917f7d8796279dc52b74026059d  $RUNNER_TEMP/swiftlint.zip
          EOF
          unzip -q "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          chmod +x "$RUNNER_TEMP/swiftlint/swiftlint-static"
      - run: >-
          "$RUNNER_TEMP/swiftlint/swiftlint-static" lint --strict
          --config .config/ariad/lints/swiftlint.yml bindings/mobile/apple
