[workspace]
members = [
    "crates/core",
    "crates/engine",
    "crates/server",
    "crates/embed",
    "crates/ffi",
    "examples/client-stream",
    "examples/loopback",
    "examples/h2-connect",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
version = "0.5.1"
publish = false
license-file = "LICENSE"
repository = "https://github.com/eluvane/ariad"

[workspace.dependencies]
ariad-core = { path = "crates/core", version = "0.5.1" }
ariad-embed = { path = "crates/embed", version = "0.5.1" }
ariad-engine = { path = "crates/engine", version = "0.5.1" }
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = [ "ring", "std" ] }
tokio = "1"
tokio-rustls = { version = "0.26", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
